{% extends "project/base.html" %}

{% block title %}Login - Delve{% endblock %}

{% block content %}
<h2>Log In</h2>
<form method="post">
  {% csrf_token %}
  {{ form }}
  <button type="submit">Log In</button>
</form>
{% if settings.DELVE_OIDC_ENABLED %}
<p>or</p>
<a href="{% url 'oidc_authentication_init' %}">
  <button type="button">Log In with Keycloak</button>
</a>
{% endif %}
{% endblock %}
